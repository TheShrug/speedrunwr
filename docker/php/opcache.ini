; The default 128M is shared memory this box cannot spare, and 48M was
; measured as sufficient for an app this size (~5,800 PHP files across
; app/ and vendor/). See the pm.max_children arithmetic in the #5 PR
; description.
;
; Deliberately NOT setting opcache.validate_timestamps=0 here: the perf
; win is small and it would make dev behave differently from production,
; which defeats the point of one shared base image.
opcache.memory_consumption=48
