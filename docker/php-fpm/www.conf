[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; ondemand instead of dynamic: workers spawn on request and exit after
; pm.process_idle_timeout, so an idle app costs zero resident workers instead
; of the dynamic default's five. See the #5 memory-budget notes.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
