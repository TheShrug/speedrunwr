; The default 128M is sized for a much larger app than this one (~5,800
; PHP files across app/ and vendor/); 48M leaves headroom without stealing
; a quarter of a 256M container budget for cache the app will never fill.
; See the pm.max_children arithmetic in the #5 PR description.
opcache.memory_consumption=48
opcache.max_accelerated_files=10000

; Code only changes on a redeploy (a fresh container), so there is no
; need to stat() every included file on every request.
opcache.validate_timestamps=0
