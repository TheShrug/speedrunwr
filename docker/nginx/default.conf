server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Built assets are committed but not fingerprinted (public/mix-manifest.json
    # maps /js/app.js -> /js/app.js, identity). A long immutable Cache-Control
    # would serve stale JS to returning visitors after every redeploy, so this
    # revalidates daily instead. See the #5 decisions comment.
    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|mp3|wav)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    client_max_body_size 16M;
}
